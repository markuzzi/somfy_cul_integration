prog_cover:
  name: "Prog Cover"
  description: "Set the cover into prog mode"
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the cover"
      example: cover.somfy_cul_abcd
open_cover:
  name: "Open Cover"
  description: "Open the cover"
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the cover"
      example: cover.somfy_cul_abcd
close_cover:
  name: "Close Cover"
  description: "Close the cover"
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the cover"
      example: cover.somfy_cul_abcd
stop_cover:
  name: "Stop Cover"
  description: "Stop the cover"
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the cover"
      example: cover.somfy_cul_abcd
reload_state:
  name: "Reload State"
  description: "Reload the state YAML file"
  fields:
    entity_id:
      name: "Entity ID"
      description: "The entity ID of the cover"
      example: cover.somfy_cul_abcd
reload_platform:
  name: "Reload SOMFY Platform"
  description: "Reconnect to the SOMFY CUL stick and restart the listener thread"
send_raw_command:
  name: "Send Raw Command"
  description: "Send a raw SOMFY CUL command and log the immediate response, if any"
  fields:
    command:
      name: "Command"
      description: "Raw command to send, without trailing newline"
      example: "V"
    timeout:
      name: "Timeout"
      description: "Seconds to wait for a response before continuing"
      example: 2

